<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="22" fill="#1c1c1e"/>
  <!-- Clock face -->
  <circle cx="50" cy="50" r="36" fill="#2c2c2e"/>
  <circle cx="50" cy="50" r="34" fill="none" stroke="#3a3a3c" stroke-width="1"/>
  <!-- Hour marks -->
  <line x1="50" y1="18" x2="50" y2="24" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="76" x2="50" y2="82" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="50" x2="24" y2="50" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="76" y1="50" x2="82" y2="50" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Hour hand (pointing ~10) -->
  <line x1="50" y1="50" x2="37" y2="30" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Minute hand (pointing ~2) -->
  <line x1="50" y1="50" x2="66" y2="32" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Second hand -->
  <line x1="50" y1="50" x2="50" y2="23" stroke="#ff3b30" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="60" stroke="#ff3b30" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="#ff3b30"/>
  <circle cx="50" cy="50" r="1.5" fill="white"/>
</svg>
